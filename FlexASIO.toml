# Force the PortAudio driver subsystem to route via Windows WASAPI
backend = "Windows WASAPI"

# 128 samples @ 48 kHz = 2.67 ms deterministic buffer window (Core 0 MMCSS Protected)
bufferSizeSamples = 128

[input]
# Disable the input system entirely to prevent floating polling thread overhead
device = ""
suggestedLatencySeconds = 0.0
wasapiExclusiveMode = true

[output]
# Hardcode the target output name exactly as reported by the system drivers
device = "HiBy USB Audio"

# Enforce Bit-Perfect Zero-Copy hardware passthrough to bypass the Windows Engine
wasapiExclusiveMode = true
wasapiAutoConvert = false
suggestedLatencySeconds = 0.0
channels = 2
